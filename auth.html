<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>جاري التحقق...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        body { background: #1a1a2e; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .box { background: #16213e; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .spinner { width: 40px; height: 40px; border: 3px solid #0f3460; border-top-color: #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #00ff88; }
        .error { color: #ff4444; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="status">جاري التحقق من الصلاحيات...</h2>
        <div class="spinner" id="loader"></div>
        <p id="message" style="margin-top:15px; color:#aaa;"></p>
    </div>

    <script src="api.js"></script>
    <script>
        async function checkAuth() {
            try {
                // طلب التحقق من البوت
                const res = await sendAPI('/auth-check', 'GET');
                
                document.getElementById('loader').style.display = 'none';

                if (res && res.success && res.isStaff) {
                    document.getElementById('status').textContent = '✅ تم التحقق بنجاح!';
                    document.getElementById('status').className = 'success';
                    document.getElementById('message').textContent = 'جاري توجيهك للوحة التحكم...';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    document.getElementById('status').textContent = '❌ غير مصرح لك بالدخول';
                    document.getElementById('status').className = 'error';
                    document.getElementById('message').textContent = 'يجب أن تكون من الموظفين أو الإدارة';
                }
            } catch (err) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('status').textContent = '⚠️ خطأ في الاتصال';
                document.getElementById('status').className = 'error';
                document.getElementById('message').textContent = 'البوت غير متصل أو رابطه غير صحيح';
            }
        }

        checkAuth();
    </script>
</body>
